name: Release

# Builds the Windows app, tests it and puts it on the Releases page.
#
# Three ways to start it:
#   - Actions > Release > Run workflow, with "Publish" ticked: releases the
#     version in oddsbreaker/__init__.py (it makes the tag itself).
#     Leave "Publish" unticked to only build; the files stay as artifacts.
#   - Push a tag like v1.0.0.
#   - Releases > Draft a new release with a new tag like v1.0.0. The files
#     are added to that release when the build is done.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release for the version in oddsbreaker/__init__.py"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build the Windows app
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q -rfE --junitxml=junit.xml
      - name: Build OddsBreaker.exe (PyInstaller)
        run: python packaging/build.py --exe
      - name: Self-test the built app (folder version)
        shell: pwsh
        run: |
          $p = Start-Process "dist/OddsBreaker/OddsBreaker.exe" -ArgumentList "--selftest","selftest-installed" -Wait -PassThru
          Get-Content selftest-installed/selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Self-test the built app (single file)
        shell: pwsh
        run: |
          $p = Start-Process "dist/onefile/OddsBreaker.exe" -ArgumentList "--selftest","selftest-onefile" -Wait -PassThru
          Get-Content selftest-onefile/selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Show failures
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path junit.xml) { python tools/ci_annotate.py junit.xml }
          foreach ($d in "selftest-installed", "selftest-onefile") {
            if (Test-Path "$d/selftest.txt") { python tools/ci_annotate.py --tail "$d/selftest.txt" "Self-test ($d)" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: dist/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-screens
          path: |
            selftest-installed
            selftest-onefile
          if-no-files-found: ignore

  package:
    name: Installer and release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Work out the version
        id: ver
        run: |
          v=$(python -c "from oddsbreaker import __version__ as v; print(v)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $v (oddsbreaker/__init__.py)"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: dist
      - name: Install NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
      - name: Build installer, portable zip and checksums
        run: python packaging/build.py --package
      - name: Release notes
        run: python packaging/release_notes.py "${{ steps.ver.outputs.tag }}" > release/NOTES.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/
      - name: Publish the GitHub release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          files=(release/OddsBreaker-$VERSION-Setup.exe release/OddsBreaker-$VERSION.exe
                 release/OddsBreaker-$VERSION-Portable.zip release/SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # made by hand on the Releases page: add the files, keep any notes written there
            gh release upload "$TAG" "${files[@]}" --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file release/NOTES.md
            fi
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" \
              --title "OddsBreaker $TAG" --notes-file release/NOTES.md
          fi
